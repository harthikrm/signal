version: 2

models:
  - name: stg_companies
    columns:
      - name: ticker
        tests: [not_null, unique]
      - name: name
        tests: [not_null]

  - name: stg_price_daily
    columns:
      - name: ticker
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: close
        tests: [not_null]

  - name: stg_financials_raw
    columns:
      - name: ticker
        tests: [not_null]
      - name: metric_name
        tests: [not_null]
      - name: period_end
        tests: [not_null]

  - name: stg_earnings
    description: "Placeholder view (no seed); aligns to earnings table shape."

  - name: stg_filings_metadata
    description: "Placeholder view (no seed); aligns to filings_metadata shape."
